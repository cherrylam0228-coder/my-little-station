<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#F5F1EA" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="我的小站" />
<meta name="description" content="清新文藝風的極簡個人主頁，可加到手機主螢幕" />

<title>我的小站</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;500;600&family=Long+Cang&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="paper-bg"></div>
<div class="leaf leaf-1">❀</div>
<div class="leaf leaf-2">✿</div>
<div class="leaf leaf-3">❋</div>

<main class="container">

  <!-- 頂部名片 -->
  <header class="card profile" id="profile">
    <div class="profile-avatar" id="avatar" title="點擊更換">
      <span id="avatarText">L</span>
    </div>
    <h1 class="profile-name" id="name" contenteditable="false">林深時見鹿</h1>
    <p class="profile-bio" id="bio" contenteditable="false">做一個溫柔的人，記錄日常的小美好 ☁️</p>

    <div class="mood-row">
      <span class="mood-dot"></span>
      <span class="mood-text" id="mood" contenteditable="false">今天想喝杯桂花烏龍</span>
    </div>

    <div class="location-row">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      <span id="location" contenteditable="false">杭州 · 窗外有雨</span>
    </div>
  </header>

  <!-- 快捷連結 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">常去的地方</h2>
      <span class="section-hint">— bookmarks</span>
    </div>

    <div class="links-grid" id="linksGrid">
      <!-- 由 JS 渲染 -->
    </div>

    <button class="add-btn" id="addLinkBtn">＋ 新增連結</button>
  </section>

  <!-- 心情筆記 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">今日小記</h2>
      <span class="section-hint">— notes</span>
    </div>

    <div class="note-card">
      <textarea id="note" placeholder="寫點什麼吧，哪怕是今天吃了什麼好吃的…"></textarea>
      <div class="note-footer">
        <span class="note-date" id="noteDate"></span>
        <span class="note-saved" id="noteSaved"></span>
      </div>
    </div>
  </section>

  <!-- 倒數 / 願望清單 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">心裡掛念的事</h2>
      <span class="section-hint">— to‑do</span>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <button class="add-btn" id="addTodoBtn">＋ 新增一條</button>
  </section>

  <!-- 聯絡方式 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">找到我</h2>
      <span class="section-hint">— contact</span>
    </div>

    <div class="contact-list" id="contactList"></div>

    <button class="add-btn" id="addContactBtn">＋ 新增聯絡方式</button>
  </section>

  <footer class="page-footer">
    <p>—— 用心生活，慢慢相遇 ——</p>
    <p class="install-hint" id="installHint"></p>
  </footer>

</main>

<!-- 浮動按鈕 -->
<button class="fab" id="editFab" title="編輯">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </svg>
</button>

<!-- 安裝提示 -->
<div class="install-banner" id="installBanner" hidden>
  <span>📱 加到手機主螢幕，隨時打開像 App 一樣</span>
  <button id="installBtn">安裝</button>
  <button class="close-x" id="installClose">×</button>
</div>

<!-- 通用彈窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h3 id="modalTitle">編輯</h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">取消</button>
      <button class="btn-primary" id="modalOk">保存</button>
    </div>
  </div>
</div>

<!-- 編輯模式提示條 -->
<div class="edit-bar" id="editBar" hidden>
  <span>✏️ 編輯模式 — 點擊文字直接修改</span>
  <button id="exitEdit">完成</button>
</div>

<script src="app.js"></script>
</body>
</html>
