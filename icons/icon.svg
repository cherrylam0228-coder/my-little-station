  <ellipse cx="222" cy="256" rx="46" ry="118" fill="#FFFBF5" fill-opacity="0.98"/>
  <ellipse cx="290" cy="256" rx="46" ry="118" fill="#FFFBF5" fill-opacity="0.98"/>
  <!-- 中軸 -->
  <rect x="252" y="138" width="8" height="240" fill="#FFFBF5" fill-opacity="0.98"/>
