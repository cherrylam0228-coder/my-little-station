  <line x1="256" y1="150" x2="256" y2="370" stroke="#A8B5A0" stroke-width="3" stroke-opacity="0.7"/>
  <!-- 右上小花點 -->
  <circle cx="400" cy="112" r="22" fill="#FFFBF5" fill-opacity="0.85"/>
  <circle cx="400" cy="112" r="8" fill="#A8B5A0" fill-opacity="0.5"/>
